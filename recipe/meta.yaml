{% set name = "uWSGI" %}
{% set version = "2.0.31" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/unbit/{{ name }}/archive/{{ version }}.tar.gz
  sha256: d5fb7b058a6e037cad1f0fb8841de56d673d80a3af036bba830143b60c67c3dc

build:
  number: 0
  # No python 3.14 version available
  skip: True  # [win or py>313]
  detect_binary_files_with_prefix: true

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - pkg-config
  host:
    - icu {{ icu }}
    - jansson 2.14
    - libpython-static {{ python }} # [py>=38]
    - libxcrypt {{ libxcrypt }}  # [linux]
    - libxml2 {{ libxml2 }}  # [not win]
    - openssl {{ openssl }}
    - pcre2 {{ pcre2 }}
    - pip
    - python
    - setuptools
    - wheel
    - yaml 0.2.5
    - zlib {{ zlib }}
    - xz {{ xz }}  # [linux]
  run:
    - jansson
    - python
# libuuid and xz fixes the overlinking or missing dependency error on linux
    - libuuid # [linux]
    - libxcrypt  # [linux]
    - xz  # [linux]

test:
  source_files:
    - tests
  requires:
    - pip
  # Test commands in run_test.sh and run_test.py

about:
  home: https://github.com/unbit/uwsgi
  license: GPL-2.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: The uWSGI project aims at developing a full stack for building hosting services
  description: |
    The uWSGI project aims at developing a full stack for building hosting
    services. Application servers (for various programming languages and
    protocols), proxies, process managers and monitors are all implemented.
  doc_url: https://uwsgi-docs.readthedocs.io
  dev_url: https://github.com/unbit/uwsgi

extra:
  recipe-maintainers:
    - kalefranz
    - ocefpaf
